name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION:-1.0.0}" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      # 按规范命名：应用名+版本号.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ExpiryGuard_${VERSION}.apk"

      # 附带源码压缩包（排除构建产物与敏感信息）
      - name: Package source
        run: |
          zip -rq "dist/ExpiryGuard_${VERSION}_源码.zip" . \
            -x ".git/*" ".gradle/*" "app/build/*" "ExpiryGuard/app/build/*" \
            ".idea/*" "*.iml" "local.properties" "*.keystore" "*.jks" \
            "keystore.properties" "*.log" "dist/*"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "ExpiryGuard v${{ env.VERSION }}"
          body: |
            ExpiryGuard（过期管家）v${{ env.VERSION }}

            ## 下载
            - ExpiryGuard_${{ env.VERSION }}.apk（调试版，可直接安装）
            - ExpiryGuard_${{ env.VERSION }}_源码.zip（完整源码）
          files: |
            dist/ExpiryGuard_${{ env.VERSION }}.apk
            dist/ExpiryGuard_${{ env.VERSION }}_源码.zip
          fail_on_unmatched_files: true
