name: Verify and release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Verify
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --max-workers=2
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expiryguard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  android-test:
    name: Room migration tests on Android emulator
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Run instrumented migration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          arch: x86_64
          target: default
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2

  release:
    name: Sign and publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, android-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      EXPIRYGUARD_KEYSTORE: ${{ github.workspace }}/expiryguard-release.jks
      EXPIRYGUARD_KEYSTORE_BASE64: ${{ secrets.EXPIRYGUARD_KEYSTORE_BASE64 }}
      EXPIRYGUARD_STORE_PASSWORD: ${{ secrets.EXPIRYGUARD_STORE_PASSWORD }}
      EXPIRYGUARD_KEY_PASSWORD: ${{ secrets.EXPIRYGUARD_KEY_PASSWORD }}
      EXPIRYGUARD_KEY_ALIAS: ${{ secrets.EXPIRYGUARD_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Decode release keystore
        run: |
          test -n "$EXPIRYGUARD_KEYSTORE_BASE64"
          test -n "$EXPIRYGUARD_STORE_PASSWORD"
          test -n "$EXPIRYGUARD_KEY_PASSWORD"
          test -n "$EXPIRYGUARD_KEY_ALIAS"
          printf '%s' "$EXPIRYGUARD_KEYSTORE_BASE64" | base64 --decode > "$EXPIRYGUARD_KEYSTORE"
          chmod 600 "$EXPIRYGUARD_KEYSTORE"
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify APK signature and package release files
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          test "v${VERSION_NAME}" = "$VERSION"
          mkdir -p dist
          cp "$APK" "dist/ExpiryGuard_${VERSION_NAME}.apk"
          git archive --format=zip --prefix="ExpiryGuard_${VERSION_NAME}_source/" \
            --output="dist/ExpiryGuard_${VERSION_NAME}_source.zip" HEAD
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ github.ref_name }}
          name: ExpiryGuard ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/ExpiryGuard_*.apk
            dist/ExpiryGuard_*_source.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
